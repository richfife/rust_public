[package]
name = "src"
version = "0.1.0"
edition = "2024"

[dependencies]
atoi = "3.1.1"
clap = { version = "4.6.7", features = ["derive"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[[bin]]
name = "src"
path = "main.rs"

[profile.release]
opt-level = 3            # Maximum optimization for speed
lto = "fat"              # Aggressive Link-Time Optimization across all crates
codegen-units = 1        # Forces LLVM to process the crate as a single unit, maximizing optimization
panic = "abort"          # Removes stack unwinding overhead (slight speed boost)
